<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker Workshop | Networking Demo</title>
    <style>
        :root {
            --bg: #090d16;
            --card: #131c2e;
            --accent: #60a5fa;
            --success: #34d399;
            --danger: #f87171;
            --text: #f1f5f9;
            --muted: #94a3b8;
            --border: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 2.5rem 1rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .wrapper {
            width: 100%;
            max-width: 640px;
        }
        .tag {
            display: inline-block;
            background: rgba(96, 165, 250, 0.15);
            color: var(--accent);
            padding: 0.35rem 0.8rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
        p.subtitle { color: var(--muted); margin-bottom: 1.5rem; font-size: 0.95rem; }
        .fact-display {
            background: #0b1120;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .quote { font-size: 1.15rem; line-height: 1.6; font-style: italic; }
        .status-pill {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            margin-top: 1rem;
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot.online { background: var(--success); box-shadow: 0 0 10px var(--success); }
        .dot.offline { background: var(--danger); box-shadow: 0 0 10px var(--danger); }
        .network-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1.5rem;
            border-top: 1px solid var(--border);
            padding-top: 1.25rem;
        }
        .grid-item { font-size: 0.85rem; color: var(--muted); }
        .grid-item strong { display: block; color: var(--text); font-size: 0.95rem; margin-top: 0.2rem; }
        button {
            width: 100%;
            padding: 0.9rem;
            background: var(--accent);
            color: #0c182d;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 1rem;
        }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="tag">🌐 Module 4: Docker Networks & DNS</div>
        <div class="card">
            <h1>Microservice Network Visualizer</h1>
            <p class="subtitle">Frontend (Nginx) calling Backend API (Python) via Docker DNS: <code>http://api:8000</code></p>

            <div class="fact-display">
                <div id="quoteText" class="quote">Connecting to backend service...</div>
                <div class="status-pill">
                    <span id="statusDot" class="dot offline"></span>
                    <span id="statusText">Checking connection...</span>
                </div>
            </div>

            <button onclick="fetchFact()">Fetch New Fact from API</button>

            <div class="network-grid">
                <div class="grid-item">Frontend Host: <strong id="frontendHost">Loading...</strong></div>
                <div class="grid-item">Backend Host: <strong id="backendHost">-</strong></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('frontendHost').textContent = window.location.host;

        async function fetchFact() {
            const quoteEl = document.getElementById('quoteText');
            const dotEl = document.getElementById('statusDot');
            const statusEl = document.getElementById('statusText');
            const backendHostEl = document.getElementById('backendHost');

            quoteEl.textContent = 'Contacting http://api:8000...';
            try {
                const res = await fetch('/api/', { cache: 'no-store' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();

                quoteEl.textContent = '"' + data.fact + '"';
                dotEl.className = 'dot online';
                statusEl.textContent = 'Connected via Docker network (workshop-net)';
                statusEl.style.color = 'var(--success)';
                backendHostEl.textContent = data.served_by;
            } catch (err) {
                quoteEl.textContent = '❌ Error: Unable to resolve or connect to backend at "http://api:8000". Are both containers on the same Docker network?';
                dotEl.className = 'dot offline';
                statusEl.textContent = 'Backend Unreachable';
                statusEl.style.color = 'var(--danger)';
                backendHostEl.textContent = 'Disconnected';
            }
        }

        fetchFact();
    </script>
</body>
</html>

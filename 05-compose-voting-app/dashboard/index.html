<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker Workshop | Live Voting Results</title>
    <style>
        :root {
            --bg: #030712;
            --card: #111827;
            --border: #1f2937;
            --text: #f9fafb;
            --muted: #9ca3af;
            --cat: #f59e0b;
            --dog: #3b82f6;
            --capy: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }
        .container { width: 100%; max-width: 640px; }
        .tag {
            display: inline-block;
            background: rgba(16, 185, 129, 0.15);
            color: var(--capy);
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
        }
        h1 { font-size: 2rem; margin-bottom: 0.25rem; }
        p.subtitle { color: var(--muted); margin-bottom: 2rem; font-size: 0.95rem; }
        .stats-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .candidate-row { margin-bottom: 1.5rem; }
        .candidate-row:last-child { margin-bottom: 0; }
        .row-header {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }
        .bar-bg {
            background: #1f2937;
            height: 16px;
            border-radius: 9999px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 9999px;
            transition: width 0.4s ease;
        }
        .bar-cat { background: var(--cat); }
        .bar-dog { background: var(--dog); }
        .bar-capy { background: var(--capy); }
        .total-box {
            margin-top: 1.75rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            color: var(--muted);
            font-size: 0.9rem;
        }
        .total-box strong { color: var(--text); }
    </style>
</head>
<body>
    <div class="container">
        <div class="tag">📊 Live Results Dashboard</div>
        <h1>Community Mascot Election</h1>
        <p class="subtitle">Real-time state pulled from Redis via Compose service discovery</p>

        <div class="stats-card">
            <div class="candidate-row">
                <div class="row-header">
                    <span>🐱 Cats</span>
                    <span id="catStats">0 votes (0%)</span>
                </div>
                <div class="bar-bg"><div id="catBar" class="bar-fill bar-cat"></div></div>
            </div>

            <div class="candidate-row">
                <div class="row-header">
                    <span>🐶 Dogs</span>
                    <span id="dogStats">0 votes (0%)</span>
                </div>
                <div class="bar-bg"><div id="dogBar" class="bar-fill bar-dog"></div></div>
            </div>

            <div class="candidate-row">
                <div class="row-header">
                    <span>🦫 Capybaras</span>
                    <span id="capyStats">0 votes (0%)</span>
                </div>
                <div class="bar-bg"><div id="capyBar" class="bar-fill bar-capy"></div></div>
            </div>

            <div class="total-box">
                <span>Total Votes Cast: <strong id="totalCount">0</strong></span>
                <span>Active API Pod: <strong id="apiPod">-</strong></span>
            </div>
        </div>
    </div>

    <script>
        async function updateDashboard() {
            try {
                // Fetch from the vote-api service exposed at localhost:3000
                const res = await fetch('http://' + window.location.hostname + ':3000/results');
                if (!res.ok) throw new Error('API offline');
                const data = await res.json();

                const total = data.total || 0;
                const catPct = total ? Math.round((data.cats / total) * 100) : 0;
                const dogPct = total ? Math.round((data.dogs / total) * 100) : 0;
                const capyPct = total ? Math.round((data.capybaras / total) * 100) : 0;

                document.getElementById('catStats').textContent = `${data.cats} votes (${catPct}%)`;
                document.getElementById('catBar').style.width = catPct + '%';

                document.getElementById('dogStats').textContent = `${data.dogs} votes (${dogPct}%)`;
                document.getElementById('dogBar').style.width = dogPct + '%';

                document.getElementById('capyStats').textContent = `${data.capybaras} votes (${capyPct}%)`;
                document.getElementById('capyBar').style.width = capyPct + '%';

                document.getElementById('totalCount').textContent = total;
                document.getElementById('apiPod').textContent = data.served_by;
            } catch (err) {
                document.getElementById('apiPod').textContent = 'Connecting...';
            }
        }

        setInterval(updateDashboard, 1000);
        updateDashboard();
    </script>
</body>
</html>
